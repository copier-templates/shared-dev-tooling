min_version = "2026.11.10"

[settings]
experimental = true
lockfile = true
minimum_release_age = "7d"

[task_config]
includes = [
  "tasks",
]

[tools]
git-cliff = "2.14"
prek = "0.5"
uv = "0.13"
"cargo:taplo-cli" = { version = "0.10", features = "native-tls" }
gum = "0.17"
shellcheck = "0.11"
shfmt = "3.14"
jactionlint = "2.6"
