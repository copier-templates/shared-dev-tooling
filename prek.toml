# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

minimum_prek_version = "0.5.0"

# Ensure Git shims exist for every stage this config uses: pre-commit fixers and
# checks, the commit-msg conventional-commit check, and the pre-push
# version-tag gate. Without this, `prek install` only installs the pre-commit
# shim and stage-specific hooks never fire.
default_install_hook_types = [
  "commit-msg",
  "pre-commit",
  "pre-push",
]

# Hooks without an explicit `stages` list run on every installed shim
# (pre-commit *and* commit-msg on every commit, plus pre-push on every push).
# Pin the default to pre-commit so each hook runs once; stage-specific hooks
# (conventional-pre-commit, check-version-tag) declare their own stages.
default_stages = [
  "pre-commit",
]

# Hold new hook revs back for a week so `prek update` never adopts a freshly published tag.
[update]
cooldown_days = 7

# Lower tiers run first. Each file-mutating fixer gets its own tier so writers never race
# on the same file; read-only checks share one tier and run concurrently after all fixers.
[priorities]
fix-eof = 0
fix-bom = 1
fix-line-endings = 2
fix-whitespace = 3
fix-toml = 4
fix-shell = 5
checks = 10

[[repos]]
repo = "https://github.com/jumanjihouse/pre-commit-hooks"
rev = "3.0.0"
hooks = [
  { id = "forbid-binary", name = "[remote] Forbid binaries", priority = "checks" },
  { id = "script-must-have-extension", name = "[remote] Non-executable shell script filename ends in .sh", priority = "checks" },
  { id = "shellcheck", name = "[remote] Test shell scripts with shellcheck", priority = "checks" },
]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files", name = "[builtin] check for added large files", priority = "checks" },
  { id = "check-executables-have-shebangs", name = "[builtin] check that executables have shebangs", priority = "checks" },
  { id = "check-merge-conflict", name = "[builtin] check for merge conflicts", priority = "checks" },
  { id = "check-toml", name = "[builtin] check toml", priority = "checks" },
  { id = "check-yaml", name = "[builtin] check yaml", priority = "checks", args = [
    "--allow-multiple-documents",
  ] },
  { id = "detect-private-key", name = "[builtin] detect private key", priority = "checks" },
  { id = "end-of-file-fixer", name = "[builtin] fix end of files", priority = "fix-eof" },
  { id = "fix-byte-order-marker", name = "[builtin] fix utf-8 byte order marker", priority = "fix-bom" },
  { id = "mixed-line-ending", name = "[builtin] mixed line ending", priority = "fix-line-endings" },
  { id = "trailing-whitespace", name = "[builtin] trim trailing whitespace", priority = "fix-whitespace", args = [
    "--markdown-linebreak-ext=md",
  ] },
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
  { id = "gitleaks", name = "[remote] Detect hardcoded secrets", priority = "checks" },
]

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.5.0"
hooks = [
  { id = "conventional-pre-commit", name = "[remote] Conventional Commit", priority = "checks", stages = [
    "commit-msg",
  ], args = [
    "--verbose",
  ] },
]

# Mirrors .pre-commit-hooks.yaml: this repo runs its own hooks as local tasks.
[[repos]]
repo = "local"
hooks = [
  { id = "mise-lock-check", name = "[local] mise lock --check", entry = "mise run mise:lock:check", language = "system", pass_filenames = false, files = '(^|/)mise(\..+)?\.(toml|lock)$|^tasks/.*\.toml$', priority = "checks" },
  { id = "mise-tasks-validate", name = "[local] mise tasks validate", entry = "mise run mise:tasks:validate", language = "system", pass_filenames = false, files = '(^|/)mise(\..+)?\.toml$|^tasks/.*\.toml$', priority = "checks" },
  { id = "shellcheck-lint", name = "[local] shellcheck", entry = "mise run shellcheck:lint", language = "system", types = [
    "shell",
  ], priority = "checks" },
  { id = "shfmt-fmt", name = "[local] shfmt -w", entry = "mise run shfmt:fmt", language = "system", types = [
    "shell",
  ], priority = "fix-shell" },
  { id = "shfmt-lint", name = "[local] shfmt -d", entry = "mise run shfmt:lint", language = "system", types = [
    "shell",
  ], priority = "checks" },
  { id = "taplo-fmt", name = "[local] taplo fmt", entry = "mise run taplo:fmt", language = "system", types = [
    "toml",
  ], exclude = '(^|/)mise(\..+)?\.toml$|^tasks/.*\.tasks\.toml$', priority = "fix-toml" },
  { id = "taplo-lint", name = "[local] taplo lint", entry = "mise run taplo:lint", language = "system", types = [
    "toml",
  ], exclude = '(^|/)mise(\..+)?\.toml$|^tasks/.*\.tasks\.toml$', priority = "checks" },
]
