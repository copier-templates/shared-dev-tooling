#:schema https://mise.jdx.dev/schema/mise-task.json
["prek:install"]
description = "Install prek git hooks"
tags = [
  "setup",
]
quiet = true
usage = 'flag "-v --verbose" help="Show full hook output"'
skip_if = "! git rev-parse --git-dir >/dev/null 2>&1 || ! test -f .pre-commit-config.yaml -o -f prek.toml"
run = """
if [ "${usage_verbose:-false}" = "true" ]; then
  exec prek install --prepare-hooks --force
else
  exec prek install --prepare-hooks --force --quiet
fi
"""

["prek:run"]
description = "Run all hooks on all files"
tags = [
  "hooks",
]
raw_args = true
skip_if = "! test -f .pre-commit-config.yaml -o -f prek.toml"
wait_for = [
  "prek:install",
]
run = "prek run --all-files"

["prek:validate"]
description = "Validate prek configuration"
tags = [
  "lint",
]
skip_if = "! test -f .pre-commit-config.yaml -o -f prek.toml"
run = """
set --
[ -f prek.toml ] && set -- "$@" prek.toml
[ -f .pre-commit-config.yaml ] && set -- "$@" .pre-commit-config.yaml
exec prek validate-config "$@"
"""

["prek:update"]
description = "Update hook revisions in prek config"
tags = [
  "deps",
]
skip_if = "! test -f .pre-commit-config.yaml -o -f prek.toml"
run = "prek update"
