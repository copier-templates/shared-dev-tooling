#:schema https://mise.jdx.dev/schema/mise-task.json
["mise:doctor"]
description = "Diagnose the mise installation and configuration"
tags = [
  "info",
]
run = "mise doctor"

["mise:lock"]
description = "Refresh mise.lock for all configured tools and task tools"
tags = [
  "deps",
]
run = "mise lock"

["mise:lock:check"]
description = "Verify mise.lock is up to date without changing it"
tags = [
  "lint",
]
run = "mise lock --check"

["mise:tasks:validate"]
description = "Validate all mise task definitions"
tags = [
  "lint",
]
run = "mise tasks validate"

["mise:install"]
description = "Install all tools pinned in mise.toml and mise.lock"
tags = [
  "setup",
]
depends = [
  "mise:lock:check",
]
run = "mise install --include-task-tools"

["mise:outdated"]
description = "List tools with newer versions than the locked ones"
tags = [
  "info",
]
run = "mise outdated --no-global"

["mise:bump"]
description = "Re-resolve tool requests to latest versions and refresh mise.lock"
tags = [
  "deps",
]
run = "mise lock --bump"
depends_post = [
  "mise:install",
]

["mise:cache:clear"]
description = "Clear mise cache so remote git:: includes are refetched"
tags = [
  "clean",
]
run = "mise cache clear"

["mise:tags"]
description = "List all task tags (sorted, unique)"
tags = [
  "info",
]
quiet = true
run = "mise tasks ls --json | tr '\\n' ' ' | grep --color=never -o '\"tags\": *\\[[^]]*\\]' | tr ',' '\\n' | grep --color=never -o '\"[^\"]*\"' | grep --color=never -v '\"tags\"' | tr -d '\"' | sort -u"

["mise:fmt"]
description = "Format mise TOML configuration in place"
tags = [
  "fmt",
]
run = "mise fmt"

["mise:fmt:check"]
description = "Check mise TOML formatting without changing files"
tags = [
  "lint",
]
run = "mise fmt --check"
