#:schema https://mise.jdx.dev/schema/mise-task.json
# Bun Tasks (JavaScript/TypeScript dependencies, tests, and artifacts)
["bun:install"]
description = "Install dependencies from the lockfile without updating it (skips when package.json is absent)"
tags = [
  "setup",
]
quiet = true
skip_if = "! test -f package.json"
run = "bun install --frozen-lockfile"

["bun:update"]
description = "Update dependencies within their declared ranges (skips when package.json is absent)"
tags = [
  "deps",
]
quiet = true
skip_if = "! test -f package.json"
run = "bun update"

["bun:outdated"]
description = "List dependencies with newer available versions (skips when package.json is absent)"
tags = [
  "info",
]
quiet = true
skip_if = "! test -f package.json"
run = "bun outdated"

["bun:audit"]
description = "Audit installed dependencies for known vulnerabilities (skips when package.json is absent)"
tags = [
  "audit",
]
quiet = true
skip_if = "! test -f package.json"
run = "bun audit"

["bun:test"]
description = "Run tests with Bun (accepts trailing file or filter arguments; skips when package.json is absent)"
tags = [
  "test",
]
quiet = true
timeout = "10m"
raw_args = true
skip_if = "! test -f package.json"
sources = [
  "package.json",
  "bun.lock",
  "**/*.{js,jsx,ts,tsx,mjs,cjs}",
]
wait_for = [
  "bun:install",
]
run = "bun test"

["bun:clean"]
description = "Clean dependency, build, and coverage artifacts"
tags = [
  "clean",
]
quiet = true
run = "rm -rf node_modules/ dist/ build/ coverage/"
