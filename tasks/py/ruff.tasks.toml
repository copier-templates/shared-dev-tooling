#:schema https://mise.jdx.dev/schema/mise-task.json
# Ruff Tasks (Python lint and format via uv)
["ruff:lint"]
description = "Lint Python with Ruff (check-only)"
tags = [
  "lint",
]
quiet = true
raw_args = true
skip_if = "! test -f pyproject.toml"
sources = [
  "pyproject.toml",
  "ruff.toml",
  ".ruff.toml",
  "**/*.py",
]
wait_for = [
  { task = "uv:install", optional = true },
]
run = "uv run --frozen ruff check"

["ruff:fix"]
description = "Lint Python with Ruff and autofix"
tags = [
  "fix",
]
quiet = true
raw_args = true
skip_if = "! test -f pyproject.toml"
sources = [
  "pyproject.toml",
  "ruff.toml",
  ".ruff.toml",
  "**/*.py",
]
wait_for = [
  { task = "uv:install", optional = true },
]
lock = "py-write"
run = "uv run --frozen ruff check --fix"

["ruff:fmt"]
description = "Format Python code in place with Ruff"
tags = [
  "fmt",
]
quiet = true
raw_args = true
skip_if = "! test -f pyproject.toml"
sources = [
  "pyproject.toml",
  "ruff.toml",
  ".ruff.toml",
  "**/*.py",
]
wait_for = [
  { task = "uv:install", optional = true },
]
lock = "py-write"
run = "uv run --frozen ruff format"

["ruff:fmt:check"]
description = "Check Python formatting with Ruff without changing files"
tags = [
  "lint",
]
quiet = true
raw_args = true
skip_if = "! test -f pyproject.toml"
sources = [
  "pyproject.toml",
  "ruff.toml",
  ".ruff.toml",
  "**/*.py",
]
wait_for = [
  { task = "uv:install", optional = true },
]
run = "uv run --frozen ruff format --check"

["ruff:validate"]
description = "Lint and format-check Python with Ruff (ruff:lint + ruff:fmt:check)"
depends = [
  "ruff:lint",
  "ruff:fmt:check",
]
