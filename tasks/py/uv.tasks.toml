# UV Tasks
["uv:install"]
description = "Install development dependencies"
tags = [
  "setup",
]
quiet = true
run = """
if [ ! -f pyproject.toml ]; then
  echo "Skipping uv install as pyproject.toml is absent"
  exit 0
fi
uv sync --all-groups
"""

["uv:upgrade"]
description = "Upgrade development dependencies"
tags = [
  "maintenance",
]
quiet = true
run = """
if [ ! -f pyproject.toml ]; then
  echo "Skipping uv upgrade as pyproject.toml is absent"
  exit 0
fi
uv sync --all-groups --upgrade
"""

["uv:audit"]
description = "Audit locked dependencies for known vulnerabilities"
tags = [
  "lint",
]
quiet = true
run = """
if [ ! -f pyproject.toml ]; then
  echo "Skipping uv audit as pyproject.toml is absent"
  exit 0
fi
uv audit --locked --preview-features audit-command
"""

["uv:lock"]
description = "Update lockfile without syncing environment"
tags = [
  "maintenance",
]
quiet = true
run = """
if [ ! -f pyproject.toml ]; then
  echo "Skipping uv lock as pyproject.toml is absent"
  exit 0
fi
uv lock
"""

["uv:lock:check"]
description = "Check lockfile is up-to-date (check-only)"
tags = [
  "lint",
]
quiet = true
run = """
if [ ! -f pyproject.toml ]; then
  echo "Skipping uv lock check as pyproject.toml is absent"
  exit 0
fi
uv lock --check
"""

["uv:sync:check"]
description = "Check environment is synchronized with lockfile (check-only)"
tags = [
  "lint",
]
quiet = true
run = """
if [ ! -f pyproject.toml ]; then
  echo "Skipping uv sync check as pyproject.toml is absent"
  exit 0
fi
uv sync --locked --check
"""

["uv:tree"]
description = "Display project dependency tree"
tags = [
  "maintenance",
]
quiet = true
run = """
if [ ! -f pyproject.toml ]; then
  echo "Skipping uv tree as pyproject.toml is absent"
  exit 0
fi
uv tree
"""

["uv:cache:prune"]
description = "Prune dangling uv cache entries"
tags = [
  "maintenance",
]
run = "uv cache prune"

["uv:clean"]
description = "Clean build and cache artifacts"
tags = [
  "maintenance",
]
quiet = true
run = """
rm -rf build/ dist/ .pytest_cache .ruff_cache htmlcov .coverage
find . -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true
find . -type d -name '*.egg-info' -exec rm -rf {} + 2>/dev/null || true
find . -type f -name '*.pyc' -delete 2>/dev/null || true
"""
