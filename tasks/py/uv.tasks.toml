#:schema https://mise.jdx.dev/schema/mise-task.json
# UV Tasks
["uv:install"]
description = "Install development dependencies"
tags = [
  "setup",
]
quiet = true
usage = 'flag "-v --verbose" help="Show full sync output"'
skip_if = "! test -f pyproject.toml"
lock = "uv"
run = """
if [ "${usage_verbose:-false}" = "true" ]; then
  exec uv sync --locked --all-groups
else
  exec uv sync --locked --all-groups --quiet
fi
"""

["uv:update"]
description = "Update development dependencies"
tags = [
  "deps",
]
quiet = true
skip_if = "! test -f pyproject.toml"
lock = "uv"
run = "uv sync --all-groups --upgrade"

["uv:audit"]
description = "Audit locked dependencies for known vulnerabilities"
tags = [
  "audit",
]
quiet = true
skip_if = "! test -f pyproject.toml || ! test -f uv.lock"
run = "uv audit --locked --preview-features audit-command"

["uv:lock"]
description = "Update lockfile without syncing environment"
tags = [
  "deps",
]
quiet = true
skip_if = "! test -f pyproject.toml"
lock = "uv"
run = "uv lock"

["uv:lock:check"]
description = "Check lockfile is up-to-date (check-only)"
tags = [
  "lint",
]
quiet = true
skip_if = "! test -f pyproject.toml"
run = "uv lock --check"

["uv:sync:check"]
description = "Check environment is synchronized with lockfile (check-only)"
tags = [
  "lint",
]
quiet = true
usage = 'flag "-v --verbose" help="Show full sync output"'
skip_if = "! test -f pyproject.toml"
run = """
if [ "${usage_verbose:-false}" = "true" ]; then
  exec uv sync --locked --check --all-groups
else
  exec uv sync --locked --check --all-groups --quiet
fi
"""

["uv:tree"]
description = "Display project dependency tree"
tags = [
  "info",
]
quiet = true
skip_if = "! test -f pyproject.toml"
run = "uv tree"

["uv:cache:prune"]
description = "Prune dangling uv cache entries"
tags = [
  "clean",
]
run = "uv cache prune"

["uv:clean"]
description = "Clean build and cache artifacts"
tags = [
  "clean",
]
quiet = true
run = """
rm -rf build/ dist/ .pytest_cache .ruff_cache htmlcov .coverage
find . -path './.git' -prune -o -path './node_modules' -prune -o -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true
find . -path './.git' -prune -o -path './node_modules' -prune -o -type d -name '*.egg-info' -exec rm -rf {} + 2>/dev/null || true
find . -path './.git' -prune -o -path './node_modules' -prune -o -type f -name '*.pyc' -delete 2>/dev/null || true
"""

["uv:clean:venv"]
description = "Remove the uv virtual environment (.venv/)"
tags = [
  "clean",
]
quiet = true
skip_if = "! test -d .venv"
run = "rm -rf .venv/"
