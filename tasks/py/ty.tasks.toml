#:schema https://mise.jdx.dev/schema/mise-task.json
# Ty Tasks (Python type checking via uv)
["ty:check"]
description = "Type-check Python with ty"
tags = [
  "lint",
]
quiet = true
raw_args = true
skip_if = "! test -f pyproject.toml"
sources = [
  "pyproject.toml",
  "uv.lock",
  "ty.toml",
  "**/*.py",
  "**/*.pyi",
]
wait_for = [
  { task = "uv:install", optional = true },
]
run = "uv run --frozen ty check"

["ty:fix"]
description = "Type-check Python with ty and autofix (experimental in ty 0.0.x)"
tags = [
  "fix",
]
quiet = true
raw_args = true
skip_if = "! test -f pyproject.toml"
sources = [
  "pyproject.toml",
  "uv.lock",
  "ty.toml",
  "**/*.py",
  "**/*.pyi",
]
wait_for = [
  { task = "uv:install", optional = true },
]
lock = "py-write"
run = "uv run --frozen ty check --fix"
