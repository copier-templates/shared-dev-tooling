#:schema https://mise.jdx.dev/schema/mise-task.json
# Scope mirrors .taplo.toml: task files and mise configs are owned by
# `mise fmt` / `mise tasks validate`, not taplo. The `!` sources below keep
# `mise run taplo:* --affected` from false-triggering on those files.
["taplo:lint"]
description = "Lint TOML documents with taplo"
tags = [
  "lint",
]
skip_if = "test -z \"$(git ls-files -- '*.toml')\""
sources = [
  "**/*.toml",
  "!tasks/**/*.tasks.toml",
  "!mise.toml",
  "!mise.*.toml",
  "taplo.toml",
  ".taplo.toml",
]
run = "taplo lint"

["taplo:fmt"]
description = "Format TOML documents in place with taplo"
tags = [
  "fmt",
]
skip_if = "test -z \"$(git ls-files -- '*.toml')\""
sources = [
  "**/*.toml",
  "!tasks/**/*.tasks.toml",
  "!mise.toml",
  "!mise.*.toml",
  "taplo.toml",
  ".taplo.toml",
]
run = "taplo fmt"

["taplo:fmt:check"]
description = "Check TOML formatting with taplo without changing files"
tags = [
  "lint",
]
skip_if = "test -z \"$(git ls-files -- '*.toml')\""
sources = [
  "**/*.toml",
  "!tasks/**/*.tasks.toml",
  "!mise.toml",
  "!mise.*.toml",
  "taplo.toml",
  ".taplo.toml",
]
run = "taplo fmt --check"
