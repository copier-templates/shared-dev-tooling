# mise fmt owns mise configuration (its ordering/TOML 1.1 rules differ from taplo),
# so taplo skips those files; run mise run mise:fmt for them.
# tasks/**/*.tasks.toml are validated by `mise tasks validate` (mise rejects
# unknown fields strictly; taplo 0.10 cannot enforce the mise-task.json schema,
# which relies on unevaluatedProperties), not by `taplo lint`.
exclude = [
  "mise.*.toml",
  "mise.toml",
  "tasks/**/*.tasks.toml",
]
[formatting]
# Keep arrays sorted
reorder_arrays = true
# always one item per line, column_width = 1 forces expansion
column_width = 1
# prevents collapsing back onto one line
array_auto_collapse = false

# git-cliff applies commit_parsers in order (first match wins), so keep its order.
[[rule]]
include = [
  "cliff.toml",
]

[rule.formatting]
reorder_arrays = false
