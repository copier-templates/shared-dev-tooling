# yaml-language-server: $schema=https://raw.githubusercontent.com/j178/prek/main/prek-hooks.schema.json
# Hooks are thin wrappers around the shared mise tasks in tasks/. Consumers must
# include those tasks via task_config.includes and pin the tools in [tools].
# See docs/guidelines/prek.md.

- id: mise-lock-check
  name: mise lock --check
  description: Verify mise.lock is up to date (runs mise:lock:check)
  entry: mise run mise:lock:check
  language: system
  pass_filenames: false
  files: (^|/)mise(\..+)?\.(toml|lock)$|^tasks/.*\.toml$

- id: mise-tasks-validate
  name: mise tasks validate
  description: Validate mise task definitions (runs mise:tasks:validate)
  entry: mise run mise:tasks:validate
  language: system
  pass_filenames: false
  files: (^|/)mise(\..+)?\.toml$|^tasks/.*\.toml$

- id: taplo-fmt
  name: taplo fmt
  description: Format TOML files in place (runs taplo:fmt)
  entry: mise run taplo:fmt
  language: system
  types: [toml]
  exclude: (^|/)mise(\..+)?\.toml$|^tasks/.*\.tasks\.toml$

- id: taplo-lint
  name: taplo lint
  description: Lint TOML files (runs taplo:lint)
  entry: mise run taplo:lint
  language: system
  types: [toml]
  exclude: (^|/)mise(\..+)?\.toml$|^tasks/.*\.tasks\.toml$

- id: shellcheck-lint
  name: shellcheck
  description: Lint shell scripts (runs shellcheck:lint)
  entry: mise run shellcheck:lint
  language: system
  types: [shell]

- id: shfmt-fmt
  name: shfmt -w
  description: Format shell scripts in place (runs shfmt:fmt)
  entry: mise run shfmt:fmt
  language: system
  types: [shell]

- id: shfmt-lint
  name: shfmt -d
  description: Check shell script formatting (runs shfmt:fmt:check)
  entry: mise run shfmt:fmt:check
  language: system
  types: [shell]
